name = "hex"
defaultTargets = ["Hex"]

# Aggregator: requires every released Hex library at a single coherent pinned
# SHA set. Require `hex` to depend on everything released; or require an
# individual library (e.g. hex-mv-poly or hex-lll) for just that piece.

[[require]]
name = "HexBasic"
git = "https://github.com/leanprover/hex-basic.git"
rev = "365881fb205210e8d27c5eb011f7ddb3fe020373"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "104a2b0c00eedf0ecab222c1a977dd53dbaa9bb3"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "5897ba144a95f929e975c3eeb5a5c5a956f8e2ba"

[[require]]
name = "HexMvPoly"
git = "https://github.com/leanprover/hex-mv-poly.git"
rev = "5ebb6d54efd140548f881f3485a608552ddd5f0b"

[[require]]
name = "HexMvPolyMathlib"
git = "https://github.com/leanprover/hex-mv-poly-mathlib.git"
rev = "d1c169a86943e38728ae0923e699bdf22db0da54"

[[require]]
name = "HexMatrix"
git = "https://github.com/leanprover/hex-matrix.git"
rev = "e76a18ae921d8d8907c8ea37235a0ca5b94698cd"

[[require]]
name = "HexMatrixMathlib"
git = "https://github.com/leanprover/hex-matrix-mathlib.git"
rev = "362370b6f82c57a6bde315610a2f1ac62b40c926"

[[require]]
name = "HexGramSchmidt"
git = "https://github.com/leanprover/hex-gram-schmidt.git"
rev = "5bb2f1b040ff2ed481233ad396cf50cd86d26cc3"

[[require]]
name = "HexGramSchmidtMathlib"
git = "https://github.com/leanprover/hex-gram-schmidt-mathlib.git"
rev = "de256b2918bd05f320f9c56a1909fc30889bb7d0"

[[require]]
name = "HexLLL"
git = "https://github.com/leanprover/hex-lll.git"
rev = "6ea0790cd3310341f88a10bc3e09e772348be32a"

[[require]]
name = "HexLLLMathlib"
git = "https://github.com/leanprover/hex-lll-mathlib.git"
rev = "a5b45bb510415841637ff2f3517bb248d14bfb8e"

[[lean_lib]]
name = "Hex"
